name: Plugins - CD
run-name: Deploy ${{ inputs.branch }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish from. Can be used to deploy PRs to dev
        default: main
      environment:
        description: Environment to publish to
        required: true
        type: choice
        options:
          - 'dev'
          - 'ops'
          - 'prod'
      docs-only:
        description: Only publish docs, do not publish the plugin
        default: false
        type: boolean

permissions:
  pull-requests: read
  contents: write
  id-token: write
  attestations: write

jobs:
  cd:
    name: CD
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v12.1.0
    with:
      branch: ${{ github.event.inputs.branch }}
      environment: ${{ github.event.inputs.environment }}
      docs-only: ${{ fromJSON(github.event.inputs.docs-only) }}
      scopes: universal

      # Argo CD inputs
      grafana-cloud-deployment-type: provisioned
      argo-workflow-slack-channel: '#grafana-catalog-ci'
      # Auto-approve every Argo stage (no manual "Resume"). Deploying to prod walks
      # through dev, ops, prod-canary and prod, so all of them need a value.
      auto-approve-durations: |-
        {"dev": 0, "ops": 0, "prod-canary": 0, "prod": 0}

      # release-please already creates the (immutable) GitHub Release for the tag,
      # so the CD workflow can't attach assets to it. Skip its release step.
      disable-github-release: true

      # Other CI inputs
      run-playwright: true
      node-version: 24
